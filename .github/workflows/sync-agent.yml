name: Validate Sync Agent
on:
  push:
    branches: [feature/web-dashboard]
    paths: ['AltMate.SyncAgent/**', 'AltMate.SyncContracts/**', 'tests/SyncAgent/**', '.github/workflows/sync-agent.yml']
  pull_request:
    paths: ['AltMate.SyncAgent/**', 'AltMate.SyncContracts/**', 'tests/SyncAgent/**', '.github/workflows/sync-agent.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build AltMate.SyncAgent/AltMate.SyncAgent.csproj -c Release
      - run: dotnet run --project tests/SyncAgent/AltMate.SyncAgent.Tests.csproj -c Release
