name: Validate Sync Agent
on:
  push:
    branches: [feature/web-dashboard]
    paths: ['AltMate.SyncAgent/**', 'AltMate.SyncContracts/**', 'tests/SyncAgent/**', 'WebSyncController.cs', 'MainWindow.WebSync.cs', 'Plugin.cs', 'Configuration.cs', 'AltMate.csproj', '.github/workflows/sync-agent.yml']
  pull_request:
    paths: ['AltMate.SyncAgent/**', 'AltMate.SyncContracts/**', 'tests/SyncAgent/**', 'WebSyncController.cs', 'MainWindow.WebSync.cs', 'Plugin.cs', 'Configuration.cs', 'AltMate.csproj', '.github/workflows/sync-agent.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build AltMate.SyncAgent/AltMate.SyncAgent.csproj -c Release
      - run: dotnet run --project tests/SyncAgent/AltMate.SyncAgent.Tests.csproj -c Release
      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $dalamudHome = Join-Path $env:RUNNER_TEMP 'dalamud'
          $archive = Join-Path $env:RUNNER_TEMP 'dalamud.zip'
          Invoke-WebRequest 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile $archive
          Expand-Archive $archive -DestinationPath $dalamudHome -Force
          "DALAMUD_HOME=$dalamudHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: dotnet build AltMate.csproj -c Release
      - run: dotnet run --project tests/Regression/Regression.csproj -c Release
