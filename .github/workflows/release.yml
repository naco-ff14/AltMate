name: Release AltMate

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_discord:
        description: "Send a Discord webhook test without creating a release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release version
        shell: pwsh
        run: |
          $project = [xml](Get-Content AltMate.csproj)
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "AltMate.csproj does not contain a Version."
          }
          $tag = "v$version"
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          git fetch --tags --force
          # rev-parseはタグが存在しない正常ケースでも終了コード1となり、
          # GitHub ActionsのPowerShellステップ自体を失敗扱いにするため使用しない。
          $matchingTags = @(git tag --list -- "$tag")
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to read Git tags."
          }
          $exists = $matchingTags.Count -gt 0
          "RELEASE_EXISTS=$($exists.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($exists) {
            Write-Host "$tag already exists. Push completed without creating another release."
          } else {
            Write-Host "A new release $tag will be created."
          }

      - name: Setup .NET
        if: env.RELEASE_EXISTS != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Download Dalamud development files
        if: env.RELEASE_EXISTS != 'true'
        shell: pwsh
        run: |
          $dalamudHome = Join-Path $env:RUNNER_TEMP "dalamud"
          $archive = Join-Path $env:RUNNER_TEMP "dalamud.zip"
          Invoke-WebRequest "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile $archive
          Expand-Archive $archive -DestinationPath $dalamudHome -Force
          "DALAMUD_HOME=$dalamudHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (-not (Test-Path (Join-Path $dalamudHome "Dalamud.dll"))) {
            throw "Dalamud.dll was not found after extracting the development files."
          }

      - name: Restore
        if: env.RELEASE_EXISTS != 'true'
        run: dotnet restore AltMate.csproj

      - name: Build
        if: env.RELEASE_EXISTS != 'true'
        run: dotnet build AltMate.csproj -c Release --no-restore

      - name: Verify manifest version
        if: env.RELEASE_EXISTS != 'true'
        shell: pwsh
        run: |
          $project = [xml](Get-Content AltMate.csproj)
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          $repo = Get-Content repo.json -Raw | ConvertFrom-Json
          if ($repo[0].AssemblyVersion -ne $projectVersion) {
            throw "repo.json AssemblyVersion '$($repo[0].AssemblyVersion)' does not match project version '$projectVersion'."
          }

      - name: Package Dalamud plugin
        if: env.RELEASE_EXISTS != 'true'
        shell: pwsh
        run: |
          $output = Join-Path $PWD "bin"
          $dll = Get-ChildItem $output -Recurse -Filter AltMate.dll |
            Where-Object { $_.FullName -match '[\\/]Release[\\/]' } |
            Select-Object -First 1
          if (-not $dll) { throw "AltMate.dll was not produced." }
          $package = Join-Path $PWD "package"
          New-Item -ItemType Directory -Force $package | Out-Null
          # NuGet依存を含め、ビルド出力に配置されたプラグインDLLをすべて同梱する。
          # Dalamud本体の参照DLLはCopyLocalされないため、ここには含まれない。
          Get-ChildItem $dll.DirectoryName -Filter *.dll | Copy-Item -Destination $package
          $deps = [IO.Path]::ChangeExtension($dll.FullName, ".deps.json")
          if (Test-Path $deps) { Copy-Item $deps $package }
          $manifest = [IO.Path]::ChangeExtension($dll.FullName, ".json")
          if (-not (Test-Path $manifest)) {
            throw "The SDK-generated AltMate.json was not produced."
          }
          Copy-Item $manifest $package
          New-Item -ItemType Directory -Force (Join-Path $package "images") | Out-Null
          Copy-Item images\icon.png (Join-Path $package "images\icon.png")
          Compress-Archive -Path "$package\*" -DestinationPath latest.zip -Force

      - name: Validate package
        if: env.RELEASE_EXISTS != 'true'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Join-Path $PWD "latest.zip"))
          try {
            $names = $zip.Entries.FullName
            foreach ($required in @(
              "AltMate.dll",
              "NoireLib.dll",
              "Penumbra.Api.dll",
              "AltMate.json",
              "images/icon.png"
            )) {
              if ($names -notcontains $required) { throw "latest.zip is missing $required" }
            }
            $manifestEntry = $zip.GetEntry("AltMate.json")
            $reader = New-Object IO.StreamReader($manifestEntry.Open())
            try { $manifest = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
            if (-not $manifest.AssemblyVersion) {
              throw "AltMate.json is missing AssemblyVersion."
            }
          } finally { $zip.Dispose() }

      - name: Publish GitHub Release
        if: env.RELEASE_EXISTS != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG latest.zip `
            --target $env:GITHUB_SHA `
            --generate-notes `
            --title "AltMate $env:RELEASE_TAG"

      - name: Notify Discord
        if: env.RELEASE_EXISTS != 'true' || inputs.test_discord == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_TEST: ${{ inputs.test_discord }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DISCORD_WEBHOOK_URL)) {
            throw "Repository secret DISCORD_WEBHOOK_URL is not configured."
          }

          $release = gh release view $env:RELEASE_TAG --json url,body | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release.url) {
            throw "Failed to read the published GitHub release."
          }

          if ($env:DISCORD_TEST -eq "true") {
            $title = "AltMate Discord通知テスト"
            $description = "新しいWebhookへの接続に成功しました。今後のリリース情報はこのチャンネルへ自動投稿されます。"
          } else {
            $title = "AltMate $env:RELEASE_TAG を公開しました"
            $description = [string]$release.body
            if ([string]::IsNullOrWhiteSpace($description)) {
              $description = "更新内容はGitHub Releaseで確認できます。"
            }
            if ($description.Length -gt 3800) {
              $description = $description.Substring(0, 3797) + "..."
            }
          }

          $payload = @{
            username = "AltMate Updates"
            avatar_url = "https://raw.githubusercontent.com/naco-ff14/AltMate/main/images/icon.png"
            allowed_mentions = @{ parse = @() }
            embeds = @(
              @{
                title = $title
                description = $description
                url = [string]$release.url
                color = 3447003
                footer = @{ text = "AltMate Release Notification" }
                timestamp = (Get-Date).ToUniversalTime().ToString("o")
              }
            )
          } | ConvertTo-Json -Depth 6

          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_URL -Method Post `
            -ContentType "application/json; charset=utf-8" -Body $payload

      - name: Upload workflow artifact
        if: env.RELEASE_EXISTS != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AltMate-latest
          path: latest.zip

      - name: Resolve linked Discord bug reports
        if: env.RELEASE_EXISTS != 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_BUG_CHANNEL_ID: ${{ secrets.DISCORD_BUG_CHANNEL_ID }}
        run: python scripts/resolve_discord_bug.py --resolve-release
